<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Finish Recorder - Windsurfer Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }

        /* Header */
        .header {
            background: #16213e;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header a {
            color: #64b5f6;
            text-decoration: none;
            font-size: 16px;
            white-space: nowrap;
            cursor: pointer;
        }
        .header .event-name {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex: 1;
        }
        .header .race-select {
            font-size: 14px;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            max-width: 160px;
            flex-shrink: 1;
            min-width: 0;
        }

        /* Race controls bar */
        .race-bar {
            background: #16213e;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 1px solid #0f3460;
            position: sticky;
            top: 44px;
            z-index: 99;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            touch-action: manipulation;
        }
        .btn-new {
            background: #0f3460;
            color: #64b5f6;
        }
        .btn-start {
            background: #27ae60;
            color: white;
        }
        .btn-start.running {
            background: #c0392b;
        }
        .btn-end {
            background: #991b1b;
            color: #fca5a5;
        }
        .btn-end.ended {
            background: #555;
            color: #999;
            cursor: default;
        }
        .btn-delete {
            background: #7f1d1d;
            color: #fca5a5;
            font-size: 13px;
            padding: 6px 10px;
        }
        .race-bar-spacer {
            width: 1px;
            height: 28px;
            background: #0f3460;
            flex-shrink: 0;
            margin: 0 4px;
        }
        .race-timer {
            font-size: 20px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            color: #ffd700;
            min-width: 60px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Section header */
        .section-header {
            background: #16213e;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #0f3460;
            position: sticky;
            top: 98px;
            z-index: 98;
            font-size: 13px;
            color: #90a4ae;
        }
        .btn-sort {
            background: #0f3460;
            color: #64b5f6;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
            white-space: nowrap;
        }
        .btn-sort:disabled {
            opacity: 0.3;
            cursor: default;
        }

        /* Sailor rows */
        .sailor-list {
            padding-bottom: 20px;
        }
        .sailor-row {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-bottom: 1px solid #222;
            gap: 8px;
            min-height: 56px;
            transition: background-color 0.3s;
        }
        .sailor-row.finished {
            background: #14532d;
        }
        .sailor-row.dnf {
            background: #78350f;
        }

        /* Status dot */
        .sdot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .sdot.green { background: #22c55e; }
        .sdot.orange { background: #f97316; }
        .sdot.gray { background: #666; }

        /* Sailor name/info area */
        .sailor-main {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        .sailor-name-line {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .sailor-name {
            font-size: 18px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .name-badge {
            padding: 1px 4px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: 700;
            color: white;
            flex-shrink: 0;
        }
        .sailor-badges {
            font-size: 13px;
            color: #90a4ae;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sailor-badges .bat-low { color: #ef4444; font-weight: 700; }
        .sailor-badges .bat-chg { color: #22c55e; font-weight: 700; }
        .sailor-info-line {
            font-size: 12px;
            color: #64b5f6;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Place badge for finished sailors */
        .place-badge {
            font-size: 14px;
            font-weight: 700;
            min-width: 36px;
            text-align: center;
            color: #ffd700;
        }
        .place-badge.p1 { color: #ffd700; }
        .place-badge.p2 { color: #c0c0c0; }
        .place-badge.p3 { color: #cd7f32; }

        /* Elapsed time for finished sailors */
        .elapsed {
            font-size: 16px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            color: #a7f3d0;
            min-width: 70px;
            text-align: right;
        }
        .dnf-label {
            font-size: 16px;
            font-weight: 700;
            color: #fbbf24;
            min-width: 40px;
            text-align: center;
        }

        /* Action buttons */
        .btn-finish {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            cursor: pointer;
            touch-action: manipulation;
            background: #1d4ed8;
            color: white;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-finish:active {
            background: #1e40af;
            transform: scale(0.95);
        }
        .btn-dnf {
            padding: 6px 10px;
            border: 1px solid #92400e;
            border-radius: 8px;
            background: transparent;
            color: #fbbf24;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            flex-shrink: 0;
            height: 36px;
            display: flex;
            align-items: center;
        }
        .btn-dnf:active {
            background: #78350f;
        }
        .btn-undo {
            padding: 6px 10px;
            border: 1px solid #555;
            border-radius: 8px;
            background: transparent;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
            touch-action: manipulation;
            flex-shrink: 0;
        }
        .btn-undo:active {
            background: #333;
        }
        .btn-pending {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            background: #333;
            color: #999;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        /* Add sailor button */
        .btn-add-sailor {
            display: block;
            margin: 12px auto;
            padding: 10px 24px;
            background: #0f3460;
            color: #64b5f6;
            border: 1px solid #1d4ed8;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            touch-action: manipulation;
        }
        .btn-add-sailor:active {
            background: #1d4ed8;
            color: white;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #c0392b;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.visible { opacity: 1; }

        /* Auth screen */
        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 16px;
        }
        .auth-screen h2 { font-size: 20px; color: #fff; }
        .auth-screen input {
            font-size: 18px;
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            width: 280px;
            text-align: center;
        }
        .auth-screen .btn {
            background: #1d4ed8;
            color: white;
            width: 280px;
            font-size: 18px;
            padding: 12px;
        }
        .auth-screen .error { color: #ef4444; font-size: 14px; }

        /* Dialogs */
        .dialog-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .dialog-overlay.visible { display: flex; }
        .dialog {
            background: #16213e;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
        }
        .dialog h3 { margin-bottom: 16px; color: #fff; font-size: 18px; }
        .dialog input {
            width: 100%;
            font-size: 16px;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid #0f3460;
            background: #1a1a2e;
            color: #e0e0e0;
            margin-bottom: 16px;
        }
        .dialog .dialog-btns {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        .dialog .btn-cancel {
            background: #333;
            color: #aaa;
        }
        .dialog .btn-ok {
            background: #1d4ed8;
            color: white;
        }

        /* Confirm delete dialog */
        .dialog p { color: #ccc; margin-bottom: 16px; font-size: 15px; }
        .btn-danger { background: #991b1b; color: #fca5a5; }
    </style>
</head>
<body>

<!-- Auth screen (hidden initially during auto-auth) -->
<div class="auth-screen" id="authScreen" style="display:none">
    <h2>Finish Recorder</h2>
    <form onsubmit="doAuth(); return false;" autocomplete="off">
        <input type="password" id="authPassword" placeholder="Admin password" autocomplete="off">
        <button class="btn" type="submit">Sign In</button>
    </form>
    <div class="error" id="authError"></div>
</div>

<!-- Main UI (hidden until auth) -->
<div id="mainUI" style="display:none">
    <div class="header">
        <a id="backLink" onclick="goBack()" href="event.html">&#8592; Live</a>
        <div class="event-name" id="eventName"></div>
        <select class="race-select" id="raceSelect" onchange="onRaceChanged()"></select>
        <button class="btn btn-new" onclick="showNewRaceDialog()">+ New</button>
        <div class="race-timer" id="raceTimer">--:--</div>
    </div>

    <div class="race-bar">
        <button class="btn btn-start" id="btnStart" onclick="onStartStop()">START</button>
        <button class="btn btn-end" id="btnEnd" onclick="showEndDialog()" style="display:none">END</button>
        <div class="race-bar-spacer" id="barSpacer1" style="display:none"></div>
        <button class="btn-sort" id="btnSort" onclick="sortByDistance()" title="Sort by distance to finish">&#8597; Sort</button>
        <button class="btn btn-delete" id="btnDelete" onclick="showDeleteDialog()" style="display:none">Del</button>
    </div>

    <div class="section-header">
        <span id="sailorCount">Sailors (0)</span>
    </div>

    <div class="sailor-list" id="sailorList"></div>
    <button class="btn-add-sailor" onclick="showAddSailorDialog()">+ Add Sailor</button>
</div>

<!-- New Race dialog -->
<div class="dialog-overlay" id="newRaceDialog">
    <div class="dialog">
        <h3>New Race</h3>
        <input type="text" id="newRaceName" placeholder="Race name" autocomplete="off">
        <div class="dialog-btns">
            <button class="btn btn-cancel" onclick="hideNewRaceDialog()">Cancel</button>
            <button class="btn btn-ok" onclick="createRace()">Create</button>
        </div>
    </div>
</div>

<!-- Delete Race dialog -->
<div class="dialog-overlay" id="deleteRaceDialog">
    <div class="dialog">
        <h3>Delete Race</h3>
        <p id="deleteRaceMsg">Delete this race and all results?</p>
        <div class="dialog-btns">
            <button class="btn btn-cancel" onclick="hideDeleteDialog()">Cancel</button>
            <button class="btn btn-danger" onclick="deleteRace()">Delete</button>
        </div>
    </div>
</div>

<!-- Reset Race dialog -->
<div class="dialog-overlay" id="resetRaceDialog">
    <div class="dialog">
        <h3>Reset Race</h3>
        <p id="resetRaceMsg">Reset the start time and all results?</p>
        <div class="dialog-btns">
            <button class="btn btn-cancel" onclick="hideResetDialog()">Cancel</button>
            <button class="btn btn-danger" onclick="doReset()">Reset</button>
        </div>
    </div>
</div>

<!-- End Race dialog -->
<div class="dialog-overlay" id="endRaceDialog">
    <div class="dialog">
        <h3>End Race</h3>
        <p id="endRaceMsg">End this race and stop the timer?</p>
        <div class="dialog-btns">
            <button class="btn btn-cancel" onclick="hideEndDialog()">Cancel</button>
            <button class="btn btn-danger" onclick="doEndRace()">End Race</button>
        </div>
    </div>
</div>

<!-- Add Sailor dialog -->
<div class="dialog-overlay" id="addSailorDialog">
    <div class="dialog">
        <h3>Add Sailor</h3>
        <input type="text" id="addSailorName" placeholder="Sailor name" autocomplete="off">
        <div class="dialog-btns">
            <button class="btn btn-cancel" onclick="hideAddSailorDialog()">Cancel</button>
            <button class="btn btn-ok" onclick="addManualSailor()">Add</button>
        </div>
    </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── URL params & API paths ──────────────────────────────────
const urlParams = new URLSearchParams(window.location.search);
const API_BASE = urlParams.get('api') || window.location.origin;
const EVENT_ID = parseInt(urlParams.get('eid')) || 1;
const DATA_BASE = `${EVENT_ID}/`;
const EVENT_API = `${API_BASE}/api/event/${EVENT_ID}`;
let adminPassword = localStorage.getItem(`adminPassword_${EVENT_ID}`) || '';

// ── State ────────────────────────────────────────────────────
let races = [];
let currentRaceId = null;
let sailors = {};           // id -> {lat,lon,spd,hdg,ts,bat,sig,chg,role,displayid,...}
let userOverrides = {};     // id -> {name, role, info}
let courseData = null;
let finishLine = null;      // {p1:{lat,lon}, p2:{lat,lon}} or null
let rowOrder = [];          // sailor IDs in display order - NEVER changes except on explicit sort
let newSailorsQueue = [];   // sailor IDs that appeared since last sort
let timerInterval = null;
let projectionInterval = null;
let manualNextId = 1;       // auto-increment for manual sailor IDs

// ── Back link (iframe-aware) ─────────────────────────────────
function goBack() {
    if (window.parent !== window) {
        window.parent.postMessage('closeFinish', '*');
    } else {
        window.location.href = `event.html?eid=${EVENT_ID}`;
    }
    return false;
}

// ── Auth ─────────────────────────────────────────────────────
async function doAuth() {
    const pw = document.getElementById('authPassword').value;
    if (!pw) return;
    adminPassword = pw;
    try {
        const r = await fetch(`${EVENT_API}/auth/check`, { headers: { 'X-Admin-Password': pw } });
        const d = await r.json();
        if (d.authenticated) {
            localStorage.setItem(`adminPassword_${EVENT_ID}`, pw);
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('mainUI').style.display = '';
            init();
        } else {
            document.getElementById('authError').textContent = 'Invalid password';
            adminPassword = '';
        }
    } catch(e) {
        document.getElementById('authError').textContent = 'Connection error';
    }
}

// Auto-auth if password stored, otherwise show auth screen
if (adminPassword) {
    fetch(`${EVENT_API}/auth/check`, { headers: { 'X-Admin-Password': adminPassword } })
        .then(r => r.json())
        .then(d => {
            if (d.authenticated) {
                document.getElementById('mainUI').style.display = '';
                init();
            } else {
                // Stored password is invalid, show auth screen
                adminPassword = '';
                document.getElementById('authScreen').style.display = '';
            }
        }).catch(() => {
            document.getElementById('authScreen').style.display = '';
        });
} else {
    document.getElementById('authScreen').style.display = '';
}

// ── Init ─────────────────────────────────────────────────────
async function init() {
    // Back link - set href for non-iframe fallback
    document.getElementById('backLink').href = `event.html?eid=${EVENT_ID}`;

    // Load event name
    try {
        const r = await fetch(`${API_BASE}/api/events`);
        const d = await r.json();
        const ev = (d.events || []).find(e => e.id === EVENT_ID);
        if (ev) document.getElementById('eventName').textContent = ev.name || `Event ${EVENT_ID}`;
    } catch(e) {}

    // Load course, user overrides, races, positions in parallel
    await Promise.all([
        loadCourse(),
        loadUserOverrides(),
        loadRaces(),
        loadPositions()
    ]);

    // Start polling and timer
    setInterval(loadPositions, 3000);
    timerInterval = setInterval(tickTimer, 1000);
    projectionInterval = setInterval(tickProjection, 1000);
}

// ── Course loading ───────────────────────────────────────────
async function loadCourse() {
    try {
        const r = await fetch(`${EVENT_API}/course`);
        if (!r.ok) return;
        courseData = await r.json();
        computeFinishLine();
    } catch(e) {}
}

function computeFinishLine() {
    if (!courseData || !courseData.finish) {
        finishLine = null;
        return;
    }
    const fin = courseData.finish;
    // Get last leg direction — walk backwards through marks to find one not at the finish
    let fromPt = null;
    if (courseData.marks && courseData.marks.length > 0) {
        for (let i = courseData.marks.length - 1; i >= 0; i--) {
            const m = courseData.marks[i];
            if (m.lat !== fin.lat || m.lon !== fin.lon) {
                fromPt = { lat: m.lat, lon: m.lon };
                break;
            }
        }
    }
    if (!fromPt && courseData.start) {
        fromPt = { lat: courseData.start.lat, lon: courseData.start.lon };
    }
    if (!fromPt) {
        finishLine = null;
        return;
    }

    // Direction from last distinct mark to finish
    const dlat = fin.lat - fromPt.lat;
    const dlon = fin.lon - fromPt.lon;
    const dist = Math.sqrt(dlat * dlat + dlon * dlon);
    if (dist === 0) { finishLine = null; return; }

    // Perpendicular direction (rotate 90 degrees)
    const plat = -dlon;
    const plon = dlat;

    // 50m in each direction (in degrees)
    const cosLat = Math.cos(fin.lat * Math.PI / 180);
    const mPerDegLat = 111111;
    const mPerDegLon = 111111 * cosLat;
    const extLat = 50 / mPerDegLat;
    const extLon = 50 / mPerDegLon;

    // Normalize perpendicular
    const pDist = Math.sqrt(plat * plat + plon * plon);
    const nLat = plat / pDist;
    const nLon = plon / pDist;

    finishLine = {
        p1: { lat: fin.lat + nLat * extLat, lon: fin.lon + nLon * extLon },
        p2: { lat: fin.lat - nLat * extLat, lon: fin.lon - nLon * extLon }
    };
    document.getElementById('btnSort').disabled = false;
}

// ── User overrides ───────────────────────────────────────────
async function loadUserOverrides() {
    try {
        const r = await fetch(`${EVENT_API}/users`, { headers: { 'X-Admin-Password': adminPassword } });
        if (!r.ok) return;
        const d = await r.json();
        userOverrides = d.users || {};
    } catch(e) {}
}

function displayName(id) {
    if (userOverrides[id] && userOverrides[id].name) return userOverrides[id].name;
    if (sailors[id] && sailors[id].displayid) return sailors[id].displayid;
    return id;
}

// ── Position loading ─────────────────────────────────────────
async function loadPositions() {
    try {
        const r = await fetch(`${DATA_BASE}current_positions.json`);
        if (!r.ok) return;
        const d = await r.json();
        const now = Date.now() / 1000;
        const sailorObj = d.sailors || {};

        for (const [sid, s] of Object.entries(sailorObj)) {
            if (s.role && s.role !== 'sailor') continue;
            // Check user override for role
            if (userOverrides[sid] && userOverrides[sid].role && userOverrides[sid].role !== 'sailor') continue;

            const existing = sailors[sid];
            sailors[sid] = {
                id: sid,
                lat: s.lat || 0,
                lon: s.lon || 0,
                spd: s.spd || 0,
                hdg: s.hdg || 0,
                ts: s.last_seen || now,
                bat: s.bat !== undefined ? s.bat : -1,
                sig: s.sig !== undefined ? s.sig : -1,
                chg: s.chg || false,
                displayid: s.displayid || null,
                idle: s.idle || false,
                stopped: s.stopped || false,
                last_seen: s.last_seen || now,
                nsats: s.nsats,
                hac: s.hac || 0,
                hr: s.hr || 0,
                flg: s.flg || {},
                info: s.info || '',
                ast: s.ast || false,
                ver: s.ver || '',
                os: s.os || '',
                hidden: s.hidden || false,
                // Projected position (reset to actual)
                proj_lat: s.lat || 0,
                proj_lon: s.lon || 0
            };

            // Track new sailors for appending to list
            if (!existing && rowOrder.indexOf(sid) === -1) {
                newSailorsQueue.push(sid);
            }
        }

        // Append new sailors to the end of the row order
        if (newSailorsQueue.length > 0) {
            for (const id of newSailorsQueue) {
                if (rowOrder.indexOf(id) === -1) {
                    rowOrder.push(id);
                }
            }
            newSailorsQueue = [];
            renderSailorList();
        } else {
            updateBadges();
        }

        document.getElementById('sailorCount').textContent = `Sailors (${rowOrder.length})`;
    } catch(e) {}
}

// ── Dead reckoning projection ────────────────────────────────
function tickProjection() {
    const now = Date.now() / 1000;
    for (const id in sailors) {
        const s = sailors[id];
        if (s.manual || s.spd <= 0 || s.idle || s.stopped) {
            s.proj_lat = s.lat;
            s.proj_lon = s.lon;
            continue;
        }
        const elapsed = now - s.ts;
        if (elapsed <= 0 || elapsed > 120) {
            s.proj_lat = s.lat;
            s.proj_lon = s.lon;
            continue;
        }
        const spdMs = s.spd * 0.5144; // knots to m/s
        const hdgRad = s.hdg * Math.PI / 180;
        const cosLat = Math.cos(s.lat * Math.PI / 180);
        s.proj_lat = s.lat + (spdMs * elapsed * Math.cos(hdgRad)) / 111111;
        s.proj_lon = s.lon + (spdMs * elapsed * Math.sin(hdgRad)) / (111111 * cosLat);
    }
}

// ── Distance to finish line ──────────────────────────────────
function distToFinish(id) {
    const s = sailors[id];
    if (!s || !finishLine) return Infinity;
    if (s.manual) return Infinity;
    if (s.proj_lat === 0 && s.proj_lon === 0) return Infinity;

    // Distance from projected position to closest point on finish line segment
    const px = s.proj_lon;
    const py = s.proj_lat;
    const x1 = finishLine.p1.lon;
    const y1 = finishLine.p1.lat;
    const x2 = finishLine.p2.lon;
    const y2 = finishLine.p2.lat;

    const dx = x2 - x1;
    const dy = y2 - y1;
    const lenSq = dx * dx + dy * dy;
    let t = lenSq > 0 ? ((px - x1) * dx + (py - y1) * dy) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = x1 + t * dx;
    const cy = y1 + t * dy;

    // Approximate distance in meters
    const cosLat = Math.cos(s.proj_lat * Math.PI / 180);
    const dLat = (s.proj_lat - cy) * 111111;
    const dLon = (s.proj_lon - cx) * 111111 * cosLat;
    return Math.sqrt(dLat * dLat + dLon * dLon);
}

function sortByDistance() {
    if (!finishLine) return;
    const race = getCurrentRace();
    const finisherIds = race ? race.finishers.map(f => f.sailor_id) : [];

    // Sort unfinished sailors by distance; keep finished ones in their place order
    rowOrder.sort((a, b) => {
        const aFinished = finisherIds.includes(a);
        const bFinished = finisherIds.includes(b);
        // Both finished - keep by finish order
        if (aFinished && bFinished) {
            const aIdx = race.finishers.findIndex(f => f.sailor_id === a);
            const bIdx = race.finishers.findIndex(f => f.sailor_id === b);
            return aIdx - bIdx;
        }
        // Finished before unfinished
        if (aFinished && !bFinished) return -1;
        if (!aFinished && bFinished) return 1;
        // Both unfinished - by distance
        return distToFinish(a) - distToFinish(b);
    });
    renderSailorList();
}

// ── Races ────────────────────────────────────────────────────
async function loadRaces() {
    try {
        const r = await fetch(`${EVENT_API}/races`);
        const d = await r.json();
        races = d.races || [];
    } catch(e) {
        races = [];
    }
    populateRaceSelect();
    renderSailorList();
}

function populateRaceSelect() {
    const sel = document.getElementById('raceSelect');
    const prevId = currentRaceId;
    sel.innerHTML = '';
    if (races.length === 0) {
        sel.innerHTML = '<option value="">No races</option>';
        currentRaceId = null;
    } else {
        for (const race of races) {
            const opt = document.createElement('option');
            opt.value = race.id;
            opt.textContent = race.name;
            sel.appendChild(opt);
        }
        // Restore selection or pick last
        if (prevId && races.find(r => r.id === prevId)) {
            sel.value = prevId;
            currentRaceId = prevId;
        } else {
            sel.value = races[races.length - 1].id;
            currentRaceId = races[races.length - 1].id;
        }
    }
    updateRaceControls();
}

function onRaceChanged() {
    currentRaceId = parseInt(document.getElementById('raceSelect').value) || null;
    updateRaceControls();
    renderSailorList();
}

function getCurrentRace() {
    return races.find(r => r.id === currentRaceId) || null;
}

function updateRaceControls() {
    const race = getCurrentRace();
    const btn = document.getElementById('btnStart');
    const del = document.getElementById('btnDelete');
    const endBtn = document.getElementById('btnEnd');
    const spacer = document.getElementById('barSpacer1');
    if (!race) {
        btn.textContent = 'START';
        btn.classList.remove('running');
        btn.disabled = true;
        del.style.display = 'none';
        endBtn.style.display = 'none';
        spacer.style.display = 'none';
        return;
    }
    btn.disabled = false;
    del.style.display = '';
    spacer.style.display = '';
    if (race.start_ts) {
        btn.textContent = 'RESET';
        btn.classList.add('running');
        // Show END button when race is started
        endBtn.style.display = '';
        if (race.end_ts) {
            endBtn.textContent = 'ENDED';
            endBtn.classList.add('ended');
            endBtn.disabled = true;
        } else {
            endBtn.textContent = 'END';
            endBtn.classList.remove('ended');
            endBtn.disabled = false;
        }
    } else {
        btn.textContent = 'START';
        btn.classList.remove('running');
        endBtn.style.display = 'none';
    }
}

// ── Timer ────────────────────────────────────────────────────
function tickTimer() {
    const race = getCurrentRace();
    const el = document.getElementById('raceTimer');
    if (!race || !race.start_ts) {
        el.textContent = '--:--';
        return;
    }
    // If race ended, show fixed duration
    if (race.end_ts) {
        const elapsed = race.end_ts - race.start_ts;
        el.textContent = formatElapsed(elapsed);
        return;
    }
    const elapsed = Date.now() / 1000 - race.start_ts;
    if (elapsed < 0) {
        el.textContent = '--:--';
        return;
    }
    el.textContent = formatElapsed(elapsed);
}

function formatElapsed(sec) {
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
}

function timeAgo(timestamp) {
    const seconds = Math.floor(Date.now() / 1000 - timestamp);
    if (seconds < 60) return `${seconds}s ago`;
    if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
    return `${Math.floor(seconds / 3600)}h ago`;
}

// ── Finish / DNF / Undo ──────────────────────────────────────
async function recordFinish(sailorId) {
    const race = getCurrentRace();
    if (!race) return;

    // Capture time synchronously
    const finish_ts = Date.now() / 1000;

    // Show hourglass immediately
    setPending(sailorId);

    try {
        const r = await fetch(`${EVENT_API}/admin/races/${race.id}/finish`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
            body: JSON.stringify({ sailor_id: sailorId, finish_ts })
        });
        if (!r.ok) {
            const d = await r.json().catch(() => ({}));
            showToast(d.error || 'Failed to record finish');
            restoreRacing(sailorId);
            return;
        }
        await loadRaces();
    } catch(e) {
        showToast('Connection error');
        restoreRacing(sailorId);
    }
}

async function recordDNF(sailorId) {
    const race = getCurrentRace();
    if (!race) return;

    setPending(sailorId);

    try {
        const r = await fetch(`${EVENT_API}/admin/races/${race.id}/dnf`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
            body: JSON.stringify({ sailor_id: sailorId })
        });
        if (!r.ok) {
            const d = await r.json().catch(() => ({}));
            showToast(d.error || 'Failed to mark DNF');
            restoreRacing(sailorId);
            return;
        }
        await loadRaces();
    } catch(e) {
        showToast('Connection error');
        restoreRacing(sailorId);
    }
}

async function undoResult(sailorId) {
    const race = getCurrentRace();
    if (!race) return;

    const row = document.querySelector(`.sailor-row[data-id="${sailorId}"]`);
    if (row) {
        const undoBtn = row.querySelector('.btn-undo');
        if (undoBtn) { undoBtn.disabled = true; undoBtn.textContent = '...'; }
    }

    try {
        const r = await fetch(`${EVENT_API}/admin/races/${race.id}/finish/${encodeURIComponent(sailorId)}`, {
            method: 'DELETE',
            headers: { 'X-Admin-Password': adminPassword }
        });
        if (!r.ok) {
            showToast('Failed to undo');
            await loadRaces();
            return;
        }
        await loadRaces();
    } catch(e) {
        showToast('Connection error');
        await loadRaces();
    }
}

function setPending(sailorId) {
    const row = document.querySelector(`.sailor-row[data-id="${sailorId}"]`);
    if (!row) return;
    const finBtn = row.querySelector('.btn-finish');
    const dnfBtn = row.querySelector('.btn-dnf');

    if (dnfBtn) { dnfBtn.disabled = true; dnfBtn.style.opacity = '0.3'; }
}

function restoreRacing(sailorId) {

    renderSailorList();
}

// ── Render sailor list ───────────────────────────────────────
function renderSailorList() {
    const container = document.getElementById('sailorList');
    const race = getCurrentRace();
    const now = Date.now() / 1000;

    // Build finisher lookup: sailor_id -> {finish_ts, status, place}
    const finisherMap = {};
    if (race) {
        let place = 0;
        for (const f of race.finishers) {
            if (f.status === 'finished') place++;
            finisherMap[f.sailor_id] = {
                finish_ts: f.finish_ts,
                status: f.status,
                place: f.status === 'finished' ? place : null
            };
        }
    }

    let html = '';
    for (const id of rowOrder) {
        const s = sailors[id];
        const fin = finisherMap[id];
        const name = displayName(id);

        if (fin && fin.status === 'finished') {
            // Finished row
            const elapsed = (race && race.start_ts && fin.finish_ts) ? fin.finish_ts - race.start_ts : 0;
            const placeNum = fin.place;
            const placeClass = placeNum <= 3 ? ` p${placeNum}` : '';
            const placeLabel = placeNum === 1 ? '1st' : placeNum === 2 ? '2nd' : placeNum === 3 ? '3rd' : `${placeNum}th`;
            html += `<div class="sailor-row finished" data-id="${id}">
                <div class="place-badge${placeClass}">${placeLabel}</div>
                <div class="sailor-main"><div class="sailor-name">${esc(name)}</div></div>
                <div class="elapsed">${formatElapsed(elapsed)}</div>
                <button class="btn-undo" onclick="undoResult('${esc(id)}')" title="Undo">\u21A9</button>
            </div>`;
        } else if (fin && fin.status === 'dnf') {
            // DNF row
            html += `<div class="sailor-row dnf" data-id="${id}">
                <div class="dnf-label">DNF</div>
                <div class="sailor-main"><div class="sailor-name">${esc(name)}</div></div>
                <button class="btn-undo" onclick="undoResult('${esc(id)}')" title="Undo">\u21A9</button>
            </div>`;
        } else {
            // Racing row
            const isManual = s && s.manual;
            const age = s ? now - s.last_seen : 9999;
            const dotClass = isManual ? 'gray' : !s ? 'gray' : age < 120 ? 'green' : 'orange';
            const nameBadges = buildNameBadges(s);
            const badges = buildBadges(s);
            const infoLine = buildInfoLine(s, id);
            const hasRace = race && race.start_ts;

            html += `<div class="sailor-row" data-id="${id}">
                <div class="sdot ${dotClass}"></div>
                ${hasRace ? `<button class="btn-finish" onclick="recordFinish('${esc(id)}')" title="Finish">\uD83C\uDFC1</button>` : ''}
                ${hasRace ? `<button class="btn-dnf" onclick="recordDNF('${esc(id)}')">DNF</button>` : ''}
                <div class="sailor-main">
                    <div class="sailor-name-line">
                        <span class="sailor-name">${esc(name)}</span>
                        <span data-namebadges="${id}">${nameBadges}</span>
                    </div>
                    <div class="sailor-badges" data-badges="${id}">${badges}</div>
                    ${infoLine ? `<div class="sailor-info-line" data-info="${id}">${infoLine}</div>` : ''}
                </div>
            </div>`;
        }
    }
    container.innerHTML = html;
}

function buildNameBadges(s) {
    if (!s || s.manual) return '';
    const badges = [];

    // ASSIST badge
    if (s.ast) {
        badges.push('<span class="name-badge" style="background:#ef4444">ASSIST</span>');
    }
    // IDLE badge
    if (s.idle) {
        badges.push('<span class="name-badge" style="background:#2563eb">IDLE</span>');
    }
    // NOGPS / accuracy badge
    if (s.nsats === 0 && !s.idle && !s.stopped) {
        badges.push('<span class="name-badge" style="background:#d97706">NOGPS</span>');
    } else if (s.hac > 100 && !s.idle && !s.stopped) {
        badges.push(`<span class="name-badge" style="background:#f97316">~${Math.round(s.hac)}m</span>`);
    }
    // Power saver warning
    const flg = s.flg || {};
    if (flg.ps === true || flg.bo === false) {
        const title = flg.ps ? 'Power saver ON' : 'Battery optimization enabled';
        badges.push(`<span class="name-badge" style="background:#f97316" title="${title}">\u26A1</span>`);
    }

    return badges.join('');
}

function buildBadges(s) {
    if (!s) return '<span style="color:#666">No data</span>';
    if (s.manual) return '<span style="color:#666">Manual</span>';
    const parts = [];

    // Speed
    if (s.spd !== undefined) {
        parts.push(`${s.spd.toFixed(1)} kn`);
    }

    // Battery
    if (s.bat >= 0) {
        const batColor = s.bat < 20 ? 'color:#ef4444;font-weight:700' : '';
        const chg = s.chg ? '<span class="bat-chg">\u26A1</span>' : '';
        parts.push(`<span style="${batColor}">${s.bat}%</span>${chg}`);
    }

    // Signal
    if (s.sig >= 0) {
        parts.push('\u2582\u2584\u2586\u2588'.slice(0, s.sig + 1));
    }

    // Satellites
    if (s.nsats !== undefined) {
        parts.push(`<span style="color:#16a34a" title="GPS satellites">&#128752;${s.nsats}</span>`);
    }

    // Time ago
    if (s.last_seen > 0) {
        parts.push(timeAgo(s.last_seen));
    }

    // Status text
    if (s.idle) {
        parts.push('<span style="color:#2563eb;font-weight:700">IDLE</span>');
    } else if (s.stopped) {
        parts.push('<span style="color:#c00;font-weight:700">STOPPED</span>');
    } else if (s.nsats === 0) {
        parts.push('<span style="color:#d97706;font-weight:700">NOGPS</span>');
    } else if (s.hac > 100) {
        parts.push(`<span style="color:#f97316;font-weight:700">BADGPS ~${Math.round(s.hac)}m</span>`);
    }

    return parts.join(' \u00B7 ');
}

function buildInfoLine(s, id) {
    if (!s || s.manual) return '';
    const parts = [];

    // User override info text
    const ov = userOverrides[id];
    const infoText = (ov && ov.info) ? ov.info : (s.info || '');
    if (infoText) {
        parts.push(esc(infoText));
    }

    // Heart rate
    if (s.hr && s.hr > 0) {
        parts.push(`<span style="color:#e91e63">\u2764\uFE0F ${s.hr} bpm</span>`);
    }

    return parts.join(' \u00B7 ');
}

// Update badge text in-place without re-rendering the list
function updateBadges() {
    for (const id of rowOrder) {
        const el = document.querySelector(`[data-badges="${id}"]`);
        if (el) {
            el.innerHTML = buildBadges(sailors[id]);
        }
        // Update name-line badges
        const nbEl = document.querySelector(`[data-namebadges="${id}"]`);
        if (nbEl) {
            nbEl.innerHTML = buildNameBadges(sailors[id]);
        }
        // Update info line
        const infoEl = document.querySelector(`[data-info="${id}"]`);
        if (infoEl) {
            infoEl.innerHTML = buildInfoLine(sailors[id], id);
        }
        // Also update status dot
        const row = document.querySelector(`.sailor-row[data-id="${id}"]`);
        if (row && !row.classList.contains('finished') && !row.classList.contains('dnf')) {
            const dot = row.querySelector('.sdot');
            if (dot && sailors[id] && !sailors[id].manual) {
                const age = Date.now() / 1000 - sailors[id].last_seen;
                dot.className = 'sdot ' + (age < 120 ? 'green' : 'orange');
            }
        }
    }
}

    setTimeout(() => t.classList.remove('visible'), 3000);
}

// Sort button state
document.getElementById('btnSort').disabled = true;
</script>
