<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Results - Windsurfer Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
        }

        .header {
            background: #1565c0;
            color: white;
            padding: 16px 20px;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .header .subtitle {
            font-size: 14px;
            opacity: 0.85;
        }
        .header a {
            color: rgba(255,255,255,0.9);
            text-decoration: none;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .download-bar {
            max-width: 640px;
            margin: 12px auto 0;
            padding: 0 16px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }
        .dl-btn {
            padding: 6px 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: white;
            color: #333;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dl-btn:hover { background: #f0f0f0; }
        .dl-btn:active { background: #e0e0e0; }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 16px;
        }

        .race-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            margin-bottom: 16px;
            overflow: hidden;
        }
        .race-header {
            background: #1976d2;
            color: white;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .race-header h2 {
            font-size: 17px;
            font-weight: 600;
        }
        .race-header .race-time-info {
            font-size: 13px;
            opacity: 0.85;
            text-align: right;
        }
        .race-header .race-duration {
            font-size: 12px;
            opacity: 0.7;
        }

        .result-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
            gap: 12px;
        }
        .result-row:last-child { border-bottom: none; }

        .place {
            font-size: 16px;
            font-weight: 700;
            min-width: 36px;
            text-align: center;
        }
        .place.p1 { color: #d4a017; }
        .place.p2 { color: #757575; }
        .place.p3 { color: #a0522d; }
        .place.other { color: #999; }

        .result-name {
            flex: 1;
            font-size: 16px;
            font-weight: 500;
        }
        .result-time {
            font-size: 15px;
            font-variant-numeric: tabular-nums;
            color: #555;
        }

        .dnf-row {
            display: flex;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #eee;
            gap: 12px;
            color: #999;
        }
        .dnf-row:last-child { border-bottom: none; }
        .dnf-badge {
            font-size: 13px;
            font-weight: 700;
            color: #b45309;
            min-width: 36px;
            text-align: center;
        }

        .no-results {
            padding: 20px 16px;
            color: #999;
            text-align: center;
            font-size: 14px;
        }
        .no-races {
            text-align: center;
            color: #999;
            padding: 60px 20px;
            font-size: 16px;
        }
        .preliminary {
            text-align: center;
            color: #999;
            font-size: 12px;
            margin-top: 8px;
            padding-bottom: 20px;
        }
        .auto-refresh {
            text-align: center;
            color: #aaa;
            font-size: 11px;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <a class="back-link" id="backLink" href="event.html">&larr; Live Tracking</a>
        <h1>Preliminary Results</h1>
        <div class="subtitle" id="eventName"></div>
    </div>

    <div class="download-bar" id="downloadBar" style="display:none">
        <button class="dl-btn" onclick="downloadXLSX()" title="Download as Excel spreadsheet">&#128196; Excel</button>
        <button class="dl-btn" onclick="downloadCSV()" title="Download as CSV">&#128196; CSV</button>
    </div>

    <div class="container" id="content">
        <div class="no-races">Loading...</div>
    </div>

    <div class="auto-refresh">Auto-refreshes every 30 seconds</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const API_BASE = urlParams.get('api') || window.location.origin;
const EVENT_ID = parseInt(urlParams.get('eid')) || 1;
const EVENT_API = `${API_BASE}/api/event/${EVENT_ID}`;

let userOverrides = {};
let currentRaces = [];
let eventName = '';

document.getElementById('backLink').href = `event.html?eid=${EVENT_ID}`;

// Load event name
fetch(`${API_BASE}/api/events`).then(r => r.json()).then(d => {
    const ev = (d.events || []).find(e => e.id === EVENT_ID);
    if (ev) {
        eventName = ev.name || '';
        document.getElementById('eventName').textContent = eventName;
    }
}).catch(() => {});

// Load user overrides for display names
async function loadUserOverrides() {
    try {
        const r = await fetch(`${EVENT_API}/users`);
        if (r.ok) {
            const d = await r.json();
            userOverrides = d.users || {};
        }
    } catch(e) {}
}

function sailorName(id) {
    if (userOverrides[id] && userOverrides[id].name) return userOverrides[id].name;
    return id;
}

function formatElapsed(sec) {
    if (!sec || sec <= 0) return '--:--';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    return `${m}:${String(s).padStart(2,'0')}`;
}

function formatTime(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatDuration(sec) {
    if (!sec || sec <= 0) return '';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = Math.floor(sec % 60);
    if (h > 0) return `${h}h ${m}m`;
    if (m > 0) return `${m}m ${s}s`;
    return `${s}s`;
}

function esc(str) {
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

async function loadResults() {
    await loadUserOverrides();

    let races = [];
    try {
        const r = await fetch(`${EVENT_API}/races`);
        const d = await r.json();
        races = d.races || [];
    } catch(e) {
        document.getElementById('content').innerHTML = '<div class="no-races">Failed to load results</div>';
        return;
    }

    if (races.length === 0) {
        document.getElementById('content').innerHTML = '<div class="no-races">No races yet</div>';
        document.getElementById('downloadBar').style.display = 'none';
        return;
    }

    // Sort most recent first (by start_ts, or by id if no start_ts)
    races.sort((a, b) => {
        if (a.start_ts && b.start_ts) return b.start_ts - a.start_ts;
        if (a.start_ts && !b.start_ts) return -1;
        if (!a.start_ts && b.start_ts) return 1;
        return b.id - a.id;
    });

    currentRaces = races;

    // Show download buttons if any race has results
    const hasResults = races.some(r => (r.finishers || []).length > 0);
    document.getElementById('downloadBar').style.display = hasResults ? 'flex' : 'none';

    let html = '';
    for (const race of races) {
        const finishers = (race.finishers || []).filter(f => f.status === 'finished');
        const dnfs = (race.finishers || []).filter(f => f.status === 'dnf');

        let timeInfo = '';
        if (!race.start_ts) {
            timeInfo = 'Not started';
        } else if (race.end_ts) {
            const dur = race.end_ts - race.start_ts;
            timeInfo = `${formatTime(race.start_ts)} - ${formatTime(race.end_ts)}<div class="race-duration">${formatDuration(dur)}</div>`;
        } else {
            timeInfo = `${formatTime(race.start_ts)} - In progress`;
        }

        html += `<div class="race-card">
            <div class="race-header">
                <h2>${esc(race.name)}</h2>
                <span class="race-time-info">${timeInfo}</span>
            </div>`;

        if (finishers.length === 0 && dnfs.length === 0) {
            html += '<div class="no-results">No results yet</div>';
        } else {
            let place = 0;
            for (const f of finishers) {
                place++;
                const elapsed = (race.start_ts && f.finish_ts) ? f.finish_ts - race.start_ts : 0;
                const placeLabel = place === 1 ? '1st' : place === 2 ? '2nd' : place === 3 ? '3rd' : `${place}th`;
                const placeClass = place <= 3 ? `p${place}` : 'other';
                html += `<div class="result-row">
                    <div class="place ${placeClass}">${placeLabel}</div>
                    <div class="result-name">${esc(sailorName(f.sailor_id))}</div>
                    <div class="result-time">${formatElapsed(elapsed)}</div>
                </div>`;
            }
            for (const f of dnfs) {
                html += `<div class="dnf-row">
                    <div class="dnf-badge">DNF</div>
                    <div class="result-name">${esc(sailorName(f.sailor_id))}</div>
                </div>`;
            }
        }

        html += '</div>';
    }

    html += '<div class="preliminary">Results are preliminary and unofficial</div>';
    document.getElementById('content').innerHTML = html;
}

// ── Build race data for export ───────────────────────────────
function buildExportData() {
    // Sort races by start time (earliest first for export)
    const races = [...currentRaces].sort((a, b) => {
        if (a.start_ts && b.start_ts) return a.start_ts - b.start_ts;
        if (a.start_ts && !b.start_ts) return -1;
        if (!a.start_ts && b.start_ts) return 1;
        return a.id - b.id;
    });

    const data = [];
    for (const race of races) {
        const finishers = (race.finishers || []).filter(f => f.status === 'finished');
        const dnfs = (race.finishers || []).filter(f => f.status === 'dnf');
        if (finishers.length === 0 && dnfs.length === 0) continue;

        const raceInfo = {
            name: race.name,
            startTime: race.start_ts ? formatTime(race.start_ts) : '',
            endTime: race.end_ts ? formatTime(race.end_ts) : '',
            duration: (race.start_ts && race.end_ts) ? formatDuration(race.end_ts - race.start_ts) : '',
        };

        const rows = [];
        let place = 0;
        for (const f of finishers) {
            place++;
            const elapsed = (race.start_ts && f.finish_ts) ? f.finish_ts - race.start_ts : 0;
            rows.push({
                place,
                name: sailorName(f.sailor_id),
                id: f.sailor_id,
                time: formatElapsed(elapsed),
                status: 'Finished',
            });
        }
        for (const f of dnfs) {
            rows.push({
                place: '',
                name: sailorName(f.sailor_id),
                id: f.sailor_id,
                time: '',
                status: 'DNF',
            });
        }

        data.push({ info: raceInfo, rows });
    }
    return data;
}

// ── CSV download ─────────────────────────────────────────────
function downloadCSV() {
    const data = buildExportData();
    if (data.length === 0) return;

    const lines = [];
    for (let i = 0; i < data.length; i++) {
        const { info, rows } = data[i];
        if (i > 0) lines.push('');
        lines.push(csvRow([info.name, 'Start: ' + info.startTime, info.endTime ? 'End: ' + info.endTime : '', info.duration]));
        lines.push(csvRow(['Place', 'Name', 'ID', 'Time', 'Status']));
        for (const r of rows) {
            lines.push(csvRow([r.place, r.name, r.id, r.time, r.status]));
        }
    }

    const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8;' });
    downloadBlob(blob, makeFilename('csv'));
}

function csvRow(fields) {
    return fields.map(f => {
        const s = String(f ?? '');
        if (s.includes(',') || s.includes('"') || s.includes('\n')) {
            return '"' + s.replace(/"/g, '""') + '"';
        }
        return s;
    }).join(',');
}

// ── XLSX download ────────────────────────────────────────────
async function downloadXLSX() {
    if (typeof ExcelJS === 'undefined') {
        alert('Excel library not loaded. Please try again.');
        return;
    }

    const data = buildExportData();
    if (data.length === 0) return;

    const wb = new ExcelJS.Workbook();
    wb.creator = 'Windsurfer Tracker';

    for (const { info, rows } of data) {
        // Sheet name: max 31 chars, no special chars
        const sheetName = info.name.replace(/[\\/*?:\[\]]/g, '').substring(0, 31);
        const ws = wb.addWorksheet(sheetName);

        // Column widths
        ws.columns = [
            { width: 8 },   // Place
            { width: 24 },  // Name
            { width: 10 },  // ID
            { width: 12 },  // Time
            { width: 10 },  // Status
        ];

        // Title row
        const titleText = info.name +
            (info.startTime ? '  |  ' + info.startTime : '') +
            (info.endTime ? ' - ' + info.endTime : '') +
            (info.duration ? '  (' + info.duration + ')' : '');
        const titleRow = ws.addRow([titleText]);
        ws.mergeCells(titleRow.number, 1, titleRow.number, 5);
        titleRow.getCell(1).font = { bold: true, size: 14, color: { argb: 'FFFFFFFF' } };
        titleRow.getCell(1).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1565C0' } };
        titleRow.getCell(1).alignment = { horizontal: 'left', vertical: 'middle' };
        titleRow.height = 28;

        // Header row
        const headerRow = ws.addRow(['Place', 'Name', 'ID', 'Time', 'Status']);
        for (let c = 1; c <= 5; c++) {
            const cell = headerRow.getCell(c);
            cell.font = { bold: true, size: 11, color: { argb: 'FFFFFFFF' } };
            cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF1976D2' } };
            cell.alignment = { horizontal: c === 1 ? 'center' : 'left', vertical: 'middle' };
        }
        headerRow.height = 22;

        // Data rows
        for (const r of rows) {
            const row = ws.addRow([r.place, r.name, r.id, r.time, r.status]);
            row.getCell(1).alignment = { horizontal: 'center' };

            // Gold/silver/bronze place coloring
            if (r.place === 1) {
                row.getCell(1).font = { bold: true, color: { argb: 'FFB8860B' } };
            } else if (r.place === 2) {
                row.getCell(1).font = { bold: true, color: { argb: 'FF757575' } };
            } else if (r.place === 3) {
                row.getCell(1).font = { bold: true, color: { argb: 'FFA0522D' } };
            }

            // DNF styling
            if (r.status === 'DNF') {
                row.getCell(5).font = { bold: true, color: { argb: 'FFB45309' } };
            }

            // Alternate row shading
            if (row.number % 2 === 0) {
                for (let c = 1; c <= 5; c++) {
                    row.getCell(c).fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF5F5F5' } };
                }
            }
        }

        // Thin borders on all data cells
        const borderStyle = { style: 'thin', color: { argb: 'FFD0D0D0' } };
        for (let r = headerRow.number; r <= ws.rowCount; r++) {
            for (let c = 1; c <= 5; c++) {
                ws.getRow(r).getCell(c).border = {
                    top: borderStyle, bottom: borderStyle,
                    left: borderStyle, right: borderStyle,
                };
            }
        }
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    downloadBlob(blob, makeFilename('xlsx'));
}

// ── Helpers ──────────────────────────────────────────────────
function makeFilename(ext) {
    const name = (eventName || 'results').replace(/[^a-zA-Z0-9_\- ]/g, '').replace(/\s+/g, '_');
    const date = new Date().toISOString().slice(0, 10);
    return `${name}_results_${date}.${ext}`;
}

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
}

// Initial load
loadResults();

// Auto-refresh every 30 seconds
setInterval(loadResults, 30000);
</script>
</body>
</html>
