<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <title>Registrations - Windsurfer Tracker</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { font-size: 1.3em; }
        .header a {
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
            font-size: 0.9em;
        }
        .header a:hover { background: rgba(255,255,255,0.3); }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: white;
            border-radius: 8px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-width: 120px;
        }
        .stat-card .num { font-size: 1.8em; font-weight: 700; color: #1e40af; }
        .stat-card .label { font-size: 0.85em; color: #666; }
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            gap: 10px;
            flex-wrap: wrap;
        }
        .toolbar input {
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.9em;
            width: 250px;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: 600;
        }
        .btn-export { background: #059669; color: white; }
        .btn-export:hover { background: #047857; }
        .btn-danger { background: #dc2626; color: white; font-size: 0.8em; padding: 4px 10px; }
        .btn-danger:hover { background: #b91c1c; }
        .btn-edit { background: #2563eb; color: white; font-size: 0.8em; padding: 4px 10px; margin-right: 4px; }
        .btn-edit:hover { background: #1d4ed8; }
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: white;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            width: 460px;
            max-width: 95vw;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal h2 { margin-bottom: 4px; font-size: 1.2em; }
        .modal .modal-email { color: #666; font-size: 0.9em; margin-bottom: 16px; }
        .modal .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .modal .form-group { display: flex; flex-direction: column; }
        .modal .form-group.full-width { grid-column: 1 / -1; }
        .modal label { font-size: 0.85em; font-weight: 600; color: #555; margin-bottom: 4px; }
        .modal input, .modal select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 0.95em;
        }
        .modal input:focus, .modal select:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
        .modal-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
        .modal-buttons .btn { padding: 9px 20px; font-size: 0.9em; }
        .btn-modal-save { background: #059669; color: white; }
        .btn-modal-save:hover { background: #047857; }
        .btn-modal-cancel { background: #e5e7eb; color: #333; }
        .btn-modal-cancel:hover { background: #d1d5db; }
        .table-wrap {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th {
            background: #f8fafc;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }
        th:hover { background: #eef2ff; }
        th .sort-arrow { font-size: 0.7em; margin-left: 4px; opacity: 0.4; }
        th.sorted .sort-arrow { opacity: 1; }
        td {
            padding: 8px 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        tr:hover { background: #f8fafc; }
        tr.unconfirmed { opacity: 0.5; }
        .status-confirmed { color: #059669; font-weight: 600; }
        .status-pending { color: #d97706; font-weight: 600; }
        .empty { text-align: center; padding: 40px; color: #888; }
        .error { text-align: center; padding: 40px; color: #dc2626; }
        @media (max-width: 700px) {
            .container { padding: 12px; }
            .toolbar input { width: 100%; }
            table { font-size: 0.8em; }
            th, td { padding: 6px 8px; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1 id="pageTitle">Registrations</h1>
    <a id="backLink" href="event.html">Back to Event</a>
</div>

<div class="container">
    <div class="stats" id="stats"></div>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Search by name, email, club..." oninput="renderTable()">
        <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
    </div>
    <div class="table-wrap">
        <table>
            <thead>
                <tr id="tableHead"></tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="12" class="empty">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="editModal">
    <div class="modal">
        <h2>Edit Registration</h2>
        <div class="modal-email" id="edit-email-display"></div>
        <input type="hidden" id="edit-email">
        <div class="form-grid">
            <div class="form-group">
                <label for="edit-name">Name</label>
                <input type="text" id="edit-name">
            </div>
            <div class="form-group">
                <label for="edit-phone">Phone</label>
                <input type="tel" id="edit-phone">
            </div>
            <div class="form-group">
                <label for="edit-sail">Sail Number</label>
                <input type="text" id="edit-sail">
            </div>
            <div class="form-group">
                <label for="edit-club">Club</label>
                <input type="text" id="edit-club">
            </div>
            <div class="form-group">
                <label for="edit-gender">Gender</label>
                <select id="edit-gender">
                    <option value="">-- Select --</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Non-binary">Non-binary</option>
                </select>
            </div>
            <div class="form-group">
                <label for="edit-weight">Weight (kg)</label>
                <input type="number" id="edit-weight" min="20" max="200" step="0.1">
            </div>
            <div class="form-group">
                <label for="edit-dob">Date of Birth</label>
                <input type="date" id="edit-dob">
            </div>
            <div class="form-group">
                <label for="edit-days">Days Racing</label>
                <select id="edit-days">
                    <option value="Both">Both days</option>
                    <option value="Saturday">Saturday only</option>
                    <option value="Sunday">Sunday only</option>
                </select>
            </div>
        </div>
        <div class="modal-buttons">
            <button class="btn btn-modal-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="btn btn-modal-save" onclick="saveReg()">Save</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const EVENT_ID = parseInt(urlParams.get('eid')) || 1;
    const EVENT_API = `/api/event/${EVENT_ID}`;

    document.getElementById('backLink').href = `event.html?eid=${EVENT_ID}`;

    let adminPassword = localStorage.getItem(`adminPassword_${EVENT_ID}`) || '';
    let registrations = [];
    let sortCol = 'name';
    let sortAsc = true;

    const columns = [
        { key: '#', label: '#', nosort: true },
        { key: 'name', label: 'Name' },
        { key: 'email', label: 'Email' },
        { key: 'phone', label: 'Phone' },
        { key: 'sail_number', label: 'Sail No.' },
        { key: 'club', label: 'Club' },
        { key: 'gender', label: 'Gender' },
        { key: 'weight', label: 'Weight' },
        { key: 'dob', label: 'DOB' },
        { key: 'days', label: 'Days' },
        { key: 'confirmed', label: 'Status' },
        { key: '_actions', label: '', nosort: true },
    ];

    // Fetch event name
    (async function() {
        try {
            const resp = await fetch('/api/events');
            if (resp.ok) {
                const data = await resp.json();
                const event = data.events.find(e => e.eid === EVENT_ID);
                if (event && event.name) {
                    document.getElementById('pageTitle').textContent = `${event.name} — Registrations`;
                    document.title = `Registrations — ${event.name}`;
                }
            }
        } catch (e) {}
    })();

    function renderHeader() {
        const tr = document.getElementById('tableHead');
        tr.innerHTML = columns.map(col => {
            if (col.nosort) return `<th>${esc(col.label)}</th>`;
            const sorted = sortCol === col.key;
            const arrow = sorted ? (sortAsc ? '▲' : '▼') : '▲';
            return `<th class="${sorted ? 'sorted' : ''}" onclick="toggleSort('${col.key}')">${esc(col.label)}<span class="sort-arrow">${arrow}</span></th>`;
        }).join('');
    }

    function toggleSort(key) {
        if (sortCol === key) {
            sortAsc = !sortAsc;
        } else {
            sortCol = key;
            sortAsc = true;
        }
        renderHeader();
        renderTable();
    }

    function renderTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        let filtered = registrations;
        if (query) {
            filtered = registrations.filter(r =>
                (r.name || '').toLowerCase().includes(query) ||
                (r.email || '').toLowerCase().includes(query) ||
                (r.club || '').toLowerCase().includes(query) ||
                (r.sail_number || '').toLowerCase().includes(query) ||
                (r.phone || '').toLowerCase().includes(query)
            );
        }

        // Sort
        const sorted = [...filtered].sort((a, b) => {
            let va = a[sortCol], vb = b[sortCol];
            if (sortCol === 'confirmed') {
                va = va ? 1 : 0;
                vb = vb ? 1 : 0;
            }
            if (sortCol === 'weight') {
                va = parseFloat(va) || 0;
                vb = parseFloat(vb) || 0;
            }
            if (typeof va === 'string') va = va.toLowerCase();
            if (typeof vb === 'string') vb = vb.toLowerCase();
            if (va < vb) return sortAsc ? -1 : 1;
            if (va > vb) return sortAsc ? 1 : -1;
            return 0;
        });

        const tbody = document.getElementById('tableBody');
        if (sorted.length === 0) {
            tbody.innerHTML = `<tr><td colspan="${columns.length}" class="empty">${query ? 'No matches' : 'No registrations yet'}</td></tr>`;
            return;
        }

        tbody.innerHTML = sorted.map((r, i) => {
            const cls = r.confirmed ? '' : ' class="unconfirmed"';
            const status = r.confirmed
                ? '<span class="status-confirmed">Confirmed</span>'
                : '<span class="status-pending">Pending</span>';
            const emailEsc = esc(r.email || '');
            return `<tr${cls} id="row-${emailEsc}">
                <td>${i + 1}</td>
                <td>${esc(r.name || '')}</td>
                <td>${emailEsc}</td>
                <td>${esc(r.phone || '')}</td>
                <td>${esc(r.sail_number || '')}</td>
                <td>${esc(r.club || '')}</td>
                <td>${esc(r.gender || '')}</td>
                <td>${r.weight || ''}</td>
                <td>${esc(r.dob || '')}</td>
                <td>${esc(r.days || '')}</td>
                <td>${status}</td>
                <td style="white-space:nowrap"><button class="btn btn-edit" onclick="editReg('${emailEsc}')">Edit</button><button class="btn btn-danger" onclick="deleteReg('${emailEsc}')">Delete</button></td>
            </tr>`;
        }).join('');

        // Stats
        const confirmed = registrations.filter(r => r.confirmed).length;
        const pending = registrations.filter(r => !r.confirmed).length;
        document.getElementById('stats').innerHTML = `
            <div class="stat-card"><div class="num">${registrations.length}</div><div class="label">Total</div></div>
            <div class="stat-card"><div class="num">${confirmed}</div><div class="label">Confirmed</div></div>
            <div class="stat-card"><div class="num">${pending}</div><div class="label">Pending</div></div>
        `;
    }

    async function loadRegistrations() {
        if (!adminPassword) {
            adminPassword = prompt('Enter admin password:');
            if (!adminPassword) {
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="${columns.length}" class="error">Admin password required</td></tr>`;
                return;
            }
        }

        try {
            const resp = await fetch(`${EVENT_API}/registrations/full`, {
                headers: { 'X-Admin-Password': adminPassword }
            });
            if (resp.status === 401) {
                adminPassword = '';
                localStorage.removeItem(`adminPassword_${EVENT_ID}`);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="${columns.length}" class="error">Invalid admin password. <a href="javascript:loadRegistrations()">Retry</a></td></tr>`;
                return;
            }
            const data = await resp.json();
            registrations = data.registrations || [];
            renderHeader();
            renderTable();
        } catch (e) {
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="${columns.length}" class="error">Error: ${esc(e.message)}</td></tr>`;
        }
    }

    async function deleteReg(email) {
        if (!confirm(`Delete registration for ${email}?`)) return;
        try {
            const resp = await fetch(`${EVENT_API}/admin/registration/${encodeURIComponent(email)}`, {
                method: 'DELETE',
                headers: { 'X-Admin-Password': adminPassword }
            });
            if (resp.ok) {
                loadRegistrations();
            } else {
                const data = await resp.json();
                alert(data.error || 'Delete failed');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    function editReg(email) {
        const reg = registrations.find(r => r.email === email);
        if (!reg) return;
        document.getElementById('edit-email').value = email;
        document.getElementById('edit-email-display').textContent = email;
        document.getElementById('edit-name').value = reg.name || '';
        document.getElementById('edit-phone').value = reg.phone || '';
        document.getElementById('edit-sail').value = reg.sail_number || '';
        document.getElementById('edit-club').value = reg.club || '';
        document.getElementById('edit-gender').value = reg.gender || '';
        document.getElementById('edit-weight').value = reg.weight || '';
        document.getElementById('edit-dob').value = reg.dob || '';
        document.getElementById('edit-days').value = reg.days || 'Both';
        document.getElementById('editModal').classList.add('active');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('active');
    }

    // Close modal on overlay click
    document.getElementById('editModal').addEventListener('click', function(e) {
        if (e.target === this) closeEditModal();
    });

    async function saveReg() {
        const email = document.getElementById('edit-email').value;
        const data = {
            name: document.getElementById('edit-name').value,
            phone: document.getElementById('edit-phone').value,
            sail_number: document.getElementById('edit-sail').value,
            club: document.getElementById('edit-club').value,
            gender: document.getElementById('edit-gender').value,
            weight: document.getElementById('edit-weight').value ? parseFloat(document.getElementById('edit-weight').value) : null,
            dob: document.getElementById('edit-dob').value,
            days: document.getElementById('edit-days').value,
        };
        try {
            const resp = await fetch(`${EVENT_API}/admin/registration/${encodeURIComponent(email)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Admin-Password': adminPassword },
                body: JSON.stringify(data)
            });
            if (resp.ok) {
                closeEditModal();
                loadRegistrations();
            } else {
                const result = await resp.json();
                alert(result.error || 'Update failed');
            }
        } catch (e) {
            alert('Error: ' + e.message);
        }
    }

    function exportCSV() {
        const headers = ['Name', 'Email', 'Phone', 'Sail Number', 'Club', 'Gender', 'Weight', 'DOB', 'Days', 'Status'];
        const rows = registrations.map(r => [
            r.name || '', r.email || '', r.phone || '', r.sail_number || '',
            r.club || '', r.gender || '', r.weight || '', r.dob || '',
            r.days || '', r.confirmed ? 'Confirmed' : 'Pending'
        ]);
        const csv = [headers, ...rows].map(row => row.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `registrations_event${EVENT_ID}.csv`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function esc(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    loadRegistrations();
</script>

</body>
</html>
