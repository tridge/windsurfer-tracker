name: WindsurferTracker
options:
  bundleIdPrefix: nz.co.tracker
  deploymentTarget:
    iOS: "15.0"
    watchOS: "8.0"
  xcodeVersion: "15.4"

attributes:
  LastUpgradeCheck: "1540"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.10.37"
    CURRENT_PROJECT_VERSION: "129"
    GIT_HASH: ""

targets:
  WindsurferTracker:
    type: application
    platform: iOS
    sources:
      - Shared
      - WindsurferTracker
    info:
      path: WindsurferTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Windsurfer Tracker"
        CFBundleName: "Windsurfer Tracker"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GIT_HASH: "$(GIT_HASH)"
        NSLocationWhenInUseUsageDescription: "Windsurfer Tracker needs your location to report your position during races."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Windsurfer Tracker needs continuous location access to track your position during races, even when the app is in the background."
        NSLocationAlwaysUsageDescription: "Windsurfer Tracker needs continuous location access to track your position during races."
        UIBackgroundModes:
          - location
          - fetch
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Windsurfer Tracker records your sailing workouts to the Health app, including distance traveled."
        NSHealthUpdateUsageDescription: "Windsurfer Tracker saves your sailing sessions as workouts with distance and calories to the Health app."
    entitlements:
      path: WindsurferTracker/WindsurferTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - target: WindsurferTrackerWatch
        embed: true
        codeSign: true
      - target: TrackerWidgetExtension
        embed: true
        codeSign: true
      - sdk: HealthKit.framework
      - sdk: ActivityKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.tracker.windsurfer
        PRODUCT_NAME: "Windsurfer Tracker"
        INFOPLIST_FILE: WindsurferTracker/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 76AR6DVKBC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG SIDELOAD"
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Andrew Tridgell (76AR6DVKBC)"
          PROVISIONING_PROFILE_SPECIFIER: "WindsurferTracker2"

  WindsurferTrackerWatch:
    type: application
    platform: watchOS
    sources:
      - Shared
      - WindsurferTrackerWatch
    resources:
      - path: WindsurferTrackerWatch/Resources/Audio
        type: folder
    dependencies:
      - sdk: HealthKit.framework
    entitlements:
      path: WindsurferTrackerWatch/WindsurferTrackerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: WindsurferTrackerWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Windsurfer Tracker"
        CFBundleName: "Windsurfer Tracker"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKRunsIndependentlyOfCompanionApp: true
        WKCompanionAppBundleIdentifier: nz.co.tracker.windsurfer
        GIT_HASH: "$(GIT_HASH)"
        NSLocationWhenInUseUsageDescription: "Windsurfer Tracker needs your location to report your position during races."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Windsurfer Tracker needs continuous location access to track your position during races."
        NSHealthShareUsageDescription: "Windsurfer Tracker records your sailing workouts including distance, heart rate, and calories burned."
        NSHealthUpdateUsageDescription: "Windsurfer Tracker saves your sailing sessions as workouts to track your fitness over time."
        UIBackgroundModes:
          - location
        WKBackgroundModes:
          - workout-processing
    settings:
      base:
        CURRENT_PROJECT_VERSION: "130"
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.tracker.windsurfer.watchkitapp
        PRODUCT_NAME: "Windsurfer Tracker"
        INFOPLIST_FILE: WindsurferTrackerWatch/Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 76AR6DVKBC
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Andrew Tridgell (76AR6DVKBC)"
          PROVISIONING_PROFILE_SPECIFIER: "WindsurferTrackerWatch"

  TrackerWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget:
      iOS: "16.2"
    sources:
      - Shared/Models/TrackerActivityAttributes.swift
      - TrackerWidgetExtension
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: ActivityKit.framework
      - sdk: SwiftUI.framework
    info:
      path: TrackerWidgetExtension/Info.plist
      properties:
        CFBundleDisplayName: "Tracker Widget"
        CFBundleName: "TrackerWidgetExtension"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nz.co.tracker.windsurfer.widget
        PRODUCT_NAME: "TrackerWidgetExtension"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 76AR6DVKBC
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Distribution: Andrew Tridgell (76AR6DVKBC)"
          PROVISIONING_PROFILE_SPECIFIER: "WindsurferTrackerWidget"

schemes:
  WindsurferTracker:
    build:
      targets:
        WindsurferTracker: all
    run:
      config: Debug
    archive:
      config: Release

  WindsurferTrackerWatch:
    build:
      targets:
        WindsurferTrackerWatch: all
    run:
      config: Debug
    archive:
      config: Release
